<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Ops — Automation Command Center</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/svg+xml" href="/static/img/nexus-mark.svg?v=5.0" />
  <link rel="stylesheet" href="/static/css/style.css?v=62.0" />
  <script>
    (function () {
      const theme = localStorage.getItem('nexus-theme-v4') || 'light';
      if (theme === 'dark') document.documentElement.classList.add('dark-theme');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <div class="app-backdrop" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="app-shell">
    <header class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <img src="/static/img/nexus-mark.svg?v=5.0" alt="" />
        </div>
        <div class="brand-text">
          <strong>Nexus Ops</strong>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="Chính">
        <p class="nav-label">Vận hành</p>
        <a href="#/register" data-route="#/register" class="nav-item is-active">
          <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M14 17.5h7M17.5 14v7" stroke-linecap="round"/></svg></span>
          <span>Bảng điều khiển</span><i class="nav-active-dot"></i>
        </a>
        <a href="#/results" data-route="#/results" class="nav-item">
          <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10h8M8 14h5" stroke-linecap="round"/></svg></span>
          <span>Kho tài khoản</span><i class="nav-active-dot"></i>
        </a>
        <a href="#/logs" data-route="#/logs" class="nav-item">
          <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6h12M6 12h12M6 18h8" stroke-linecap="round"/></svg></span>
          <span>Dòng sự kiện</span><i class="nav-active-dot"></i>
        </a>
        <a href="#/keys" data-route="#/keys" class="nav-item">
          <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 2l-2 2m-1.5 1.5L14 9l-3-3 2.5-2.5a2.121 2.121 0 0 1 3 0l4.5 4.5z"/><circle cx="7.5" cy="16.5" r="4.5"/><path d="M10.7 13.3L19 5"/></svg></span>
          <span>🔑 Tạo Key Bán Lẻ</span><i class="nav-active-dot"></i>
        </a>
        <p class="nav-label">Quản trị</p>
        <a href="#/settings" data-route="#/settings" class="nav-item">
          <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
          <span>Thiết lập</span><i class="nav-active-dot"></i>
        </a>
        <a href="#/tools" data-route="#/tools" class="nav-item">
          <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8l8-4 8 4-8 4-8-4z"/><path d="M4 16l8 4 8-4M4 12l8 4 8-4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>Hệ sinh thái</span><i class="nav-active-dot"></i>
        </a>
      </nav>
      <div class="sidebar-foot">
        <div class="run-pill" id="run-pill">
          <span class="status-orb"><i class="dot"></i></span>
          <span><b id="run-pill-text">Sẵn sàng</b><small>Trạng thái hệ thống</small></span>
        </div>
        <div class="version"><span>NEXUS CORE</span><span>v2.0</span></div>
      </div>
    </header>

    <button class="mobile-menu" id="mobile-menu" type="button" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <div class="content-shell">
      <header class="topbar">
        <div class="topbar-copy">
          <h1 id="page-title">Bảng điều khiển</h1>
          <p class="eyebrow" id="page-eyebrow">Thiết lập và theo dõi các phiên đăng ký.</p>
        </div>
        <div class="topbar-actions">
          <div class="health-chip"><i></i><span>API Online</span></div>
          <button id="theme-toggle" class="theme-toggle-btn" type="button" title="Đổi giao diện" aria-label="Đổi giao diện">
            <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <div class="operator-avatar" title="Local operator">OP</div>
        </div>
      </header>
      <main id="main-content" class="main-content"></main>
    </div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script type="module" src="/static/js/app.js?v=72.2"></script>
</body>
</html>
